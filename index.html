<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰光实验室 | GrayLight Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=block" rel="stylesheet">

    <style>
        :root {
            --accent: #3b82f6;
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
            /* 🚨 账本 130 条：物理结构缩放 420px */
            --sidebar-w: 420px;
            --spring: cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }

        .theme-dark {
            --surface: #0a0a0a;
            --on-surface: #fff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(10, 10, 12, 0.75);
            /* 🚨 调优遮罩底色防白色底图穿透 */
            --text-dim: rgba(255, 255, 255, 0.3);
            --aurora: rgba(59, 130, 246, 0.15);
            --btn-active: #3b82f6;
            --btn-active-text: #fff;
            --inner-panel: rgba(0, 0, 0, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), 0 1px 1px 0 rgba(255, 255, 255, 0.05) inset;
            /* 🚨 物理边缘高档阴影 */
            --icon-shadow: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
            /* 🚨 图标投影保护 */
        }

        .theme-light {
            --surface: #f0f7ff;
            --on-surface: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(59, 130, 246, 0.12);
            --panel-bg: rgba(255, 255, 255, 0.85);
            /* 🚨 调优遮罩底色防深色底图穿透 */
            --text-dim: rgba(30, 41, 59, 0.5);
            --aurora: rgba(59, 130, 246, 0.3);
            --btn-active: #2563eb;
            --btn-active-text: #fff;
            --inner-panel: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(59, 130, 246, 0.08), 0 1px 1px 0 rgba(255, 255, 255, 0.5) inset;
            /* 🚨 物理边缘高档阴影 */
            --icon-shadow: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.8));
            /* 🚨 图标投影保护 */
        }

        body {
            background-color: var(--surface);
            color: var(--on-surface);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.5s var(--easing), color 0.5s var(--easing);
        }

        .aurora-bg {
            position: fixed;
            inset: -50%;
            z-index: -1;
            opacity: 0.8;
            background: radial-gradient(circle at 15% 15%, var(--aurora) 0%, transparent 45%), radial-gradient(circle at 85% 85%, var(--aurora) 0%, transparent 45%);
            filter: blur(120px);
            animation: aurora-float 20s infinite alternate var(--easing);
        }

        @keyframes aurora-float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-2%, 5%) scale(0.95);
            }
        }

        * {
            user-select: none;
        }

        img,
        canvas {
            -webkit-user-drag: none;
        }

        #main-sidebar {
            background: var(--surface);
            border-right: 1px solid var(--glass-border);
            width: var(--sidebar-w);
            transition: transform 0.6s var(--easing), margin-left 0.6s var(--easing), background 0.5s var(--easing);
            flex-shrink: 0;
            position: relative;
            height: 100vh;
            z-index: 50;
        }

        #main-sidebar.collapsed {
            margin-left: calc(-1 * var(--sidebar-w));
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow);
            /* 🚨 应用双重高档边缘阴影 */
            /* 统移动力学：颜色 0.5s 全量同步，位移 0.4s 随动 */
            transition: background 0.5s var(--easing), border-color 0.5s var(--easing), color 0.5s var(--easing), transform 0.4s var(--easing), box-shadow 0.5s var(--easing);
        }

        #reset-view,
        #theme-toggle,
        #invert-toggle,
        #blend-toggle {
            height: 40px;
            /* 🚨 统一度量衡 h-10 */
            border-radius: 12px !important;
            /* 🚨 统一胶囊圆角，覆盖默认的 28px */
            color: var(--on-surface);
            cursor: pointer;
            transition: background 0.5s var(--easing), border-color 0.5s var(--easing), color 0.5s var(--easing), transform 0.3s var(--easing), box-shadow 0.5s var(--easing);
            display: flex;
            align-items: center;
        }

        #reset-view {
            padding: 0 20px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            gap: 8px;
        }

        #theme-toggle,
        #invert-toggle,
        #blend-toggle {
            width: 40px;
            justify-content: center;
        }

        #reset-view:hover,
        #theme-toggle:hover,
        #invert-toggle:hover,
        #blend-toggle:hover {
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #reset-view svg,
        #theme-toggle svg,
        #invert-toggle svg,
        #blend-toggle svg {
            filter: var(--icon-shadow);
            /* 🚨 引入 SVG 图标防强光投影防护 */
            transition: filter 0.5s var(--easing);
        }

        #sidebar-toggle {
            position: absolute;
            left: 100%;
            top: 24px;
            width: 28px;
            height: 54px;
            background: inherit;
            border: 1px solid var(--glass-border);
            border-left: none;
            /* 物理缝合：严禁左边框 */
            border-radius: 0 12px 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            margin-left: -1px;
            /* 物理缝合：压住侧边栏边框 */
            /* 位移延迟 0.1s，颜色/边框色 0 延迟同步 */
            transition: transform 0.4s var(--easing) 0.1s, background 0.5s var(--easing), border-color 0.5s var(--easing), color 0.5s var(--easing);
        }

        #main-sidebar.collapsed #sidebar-toggle {
            transition: transform 0.4s var(--easing) 0s, background 0.5s var(--easing), border-color 0.5s var(--easing), color 0.5s var(--easing);
        }

        #main-sidebar.collapsed #sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .layer-item {
            transition: background 0.5s var(--easing), border-color 0.5s var(--easing), color 0.5s var(--easing), transform 0.4s var(--easing);
        }

        .keying-panel {
            transition: all 0.5s var(--spring);
        }

        .magnifier {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            overflow: hidden;
            display: none;
            z-index: 100;
            pointer-events: none;
            /* 必须穿透，否则会挡住点击 */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            background: #000;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .magnifier canvas {
            image-rendering: pixelated;
            width: 100%;
            height: 100%;
        }

        .magnifier-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 1.5px solid #fff;
            mix-blend-mode: difference;
        }

        .bg-checkerboard {
            background-image: conic-gradient(#1a1a1a 90deg, #222 90deg 180deg, #1a1a1a 180deg 270deg, #222 270deg);
            background-size: 10px 10px;
        }

        #main-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            cursor: move;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transition: filter 0.3s var(--easing);
        }

        #main-canvas.invert-active {
            filter: invert(1);
        }

        input[type="range"] {
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 2px;
            outline: none;
            /* 🚨 彻底移除点击滑块后的白框聚焦环 */
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            /* 🚨 动力学同步：伪元素必须显式声明 background/border 过渡以消除跳变 */
            transition: transform 0.2s var(--easing), box-shadow 0.2s var(--easing), background 0.5s var(--easing), border-color 0.5s var(--easing);
            border: 2px solid var(--surface);
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.2);
            border-radius: 10px;
        }

        .ab-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            position: relative;
        }

        .ab-selection {
            position: absolute;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            cursor: grab;
        }

        .ab-handle {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #fff;
            border: 2px solid var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: ew-resize;
            z-index: 10;
            /* 🚨 同步过渡 */
            transition: transform 0.2s, background 0.5s var(--easing), border-color 0.5s var(--easing);
        }

        .ab-handle:hover {
            transform: translate(-50%, -50%) scale(1.3);
        }

        .shimmer-text {
            background: linear-gradient(90deg, var(--on-surface) 0%, var(--accent) 50%, var(--on-surface) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
            /* 🚨 工业级字符保护：防止 background-clip: text 裁剪边缘字形 */
            padding-right: 0.05em;
            margin-right: -0.05em;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        #dropzone.drag-active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
            transform: scale(1.02);
        }

        /* 🚨 工业级标准化按钮体系 (Industrial Standards) */
        .btn-control-circle {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            /* 🚨 动力学同步：全量锁定 0.5s 消除模式切换残影 */
            transition: background 0.5s var(--easing), border-color 0.5s var(--easing), color 0.5s var(--easing), transform 0.3s var(--easing);
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-control-circle:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        /* 动力学反馈 (Kinetics) */
        .active-bounce-circle:active {
            transform: scale(0.9);
        }

        .active-bounce-rect:active {
            transform: scale(0.95);
        }

        .btn-mode-active {
            background: var(--btn-active) !important;
            color: var(--btn-active-text) !important;
            border-color: var(--btn-active) !important;
        }

        /* 🚨 工业级输入聚焦协议 (Focus Protocol Visuals) */
        input[type="text"] {
            transition: background 0.3s var(--easing), box-shadow 0.3s var(--easing);
        }

        input[type="text"]:focus {
            background: rgba(59, 130, 246, 0.08) !important;
            box-shadow: 0 0 0 1px var(--glass-border);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            :root {
                --sidebar-w: 100vw;
            }

            #main-sidebar {
                position: absolute;
                left: 0;
                top: 0;
                height: 100vh;
                box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
            }

            .absolute.top-8.right-8 {
                top: 16px;
                right: 16px;
                gap: 8px;
                z-index: 40;
            }

            #reset-view {
                height: 36px;
                padding: 0 12px;
                font-size: 10px;
            }

            #theme-toggle,
            #invert-toggle {
                height: 36px;
                width: 36px;
            }

            #placeholder .text-7xl {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body class="flex theme-dark">
    <div class="aurora-bg"></div>
    <aside id="main-sidebar" class="p-7 flex flex-col gap-6 backdrop-blur-xl">
        <button id="sidebar-toggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="3">
                <polyline points="11 17 6 12 11 7" />
                <polyline points="18 17 13 12 18 7" />
            </svg></button>
        <header class="px-2 flex-shrink-0 flex flex-col gap-3">
            <h1 class="text-xl font-black uppercase">TECHSUN <span class="font-light opacity-50">STUDIO</span></h1>
            <!-- 功能模式切换 Tab -->
            <div class="flex p-1 rounded-xl bg-black/40 border border-white/5 text-[10px] font-black uppercase">
                <span
                    class="flex-grow py-1.5 rounded-lg text-center bg-blue-500 text-white shadow-lg shadow-blue-500/20">灰光实验室</span>
                <a href="../sequence-viewer/index.html"
                    class="flex-grow py-1.5 rounded-lg text-center opacity-40 hover:opacity-100 transition-all">序列帧查看器</a>
            </div>
        </header>
        <div id="dropzone"
            class="glass-panel p-8 flex flex-col items-center justify-center gap-4 cursor-pointer border-dashed border-2 grow-0 h-[140px] flex-shrink-0">
            <div class="w-10 h-10 rounded-full flex items-center justify-center border transition-all duration-500"
                style="background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.2);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
            </div>
            <div class="text-center">
                <p class="text-[11px] font-black uppercase tracking-widest">导入素材</p>
                <p class="text-[9px] font-black uppercase tracking-[0.15em] opacity-20 mt-1">PNG, JPG, WEBP</p>
            </div>
        </div>
        <div class="flex items-center justify-between px-2 flex-shrink-0">
            <h2 class="text-[11px] font-black uppercase opacity-60">图层管理</h2>
            <button id="clear-all-layers"
                class="flex items-center gap-2 px-3 h-8 rounded-full text-red-500 hover:bg-red-500/10 transition-all active-bounce-rect"
                style="background: var(--glass-bg); border: 1px solid var(--glass-border);">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5">
                    <path d="M18 6 6 18M6 6l12 12" />
                </svg>
                <span class="text-[9px] font-black uppercase tracking-wider">清空全部</span>
            </button>
        </div>
        <div id="layer-list" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 px-1"
            style="scroll-padding-top: 10px;">
            <div class="text-center py-20 text-xs opacity-50 italic">等待素材导入...</div>
        </div>
        <div class="glass-panel p-5 space-y-5 flex-shrink-0">
            <div class="space-y-5">
                <div class="flex items-center justify-between px-1">
                    <div class="text-[11px] font-black uppercase opacity-50">播放速率</div>
                    <input type="text" id="rate-num"
                        class="text-[12px] font-mono font-black text-blue-500 bg-transparent border-none outline-none w-10 text-right uppercase"
                        value="0.5X" onfocus="this.select()">
                </div>
                <input type="range" id="rate-slider" min="0.1" max="2" step="0.1" value="0.5">
            </div>
            <div class="space-y-5">
                <div class="flex justify-between items-center px-1">
                    <div class="text-[11px] font-black uppercase opacity-50">时间轴</div>
                    <input type="text" id="timeline-num"
                        class="text-[12px] font-mono font-black text-blue-500 bg-transparent border-none outline-none w-12 text-right uppercase"
                        value="0.0%" onfocus="this.select()">
                </div>
                <div class="flex items-center gap-[10px]">
                    <input type="range" id="timeline-slider" class="flex-grow" min="0" max="1" step="0.001" value="0">
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <button id="direction-toggle" class="btn-control-circle active-bounce-circle">
                            <svg class="direction-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5">
                                <path d="m17 2 4 4-4 4" />
                                <path d="M3 10v-1a4 4 0 0 1 4-4h14" />
                                <path d="m7 22-4-4 4-4" />
                                <path d="M21 14v1a4 4 0 0 1-4 4H3" />
                            </svg>
                        </button>
                        <button id="play-pause-btn" class="btn-control-circle active-bounce-circle">
                            <svg id="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="4" width="4" height="16" rx="1" />
                                <rect x="14" y="4" width="4" height="16" rx="1" />
                            </svg>
                            <svg id="play-icon" class="hidden" width="16" height="16" viewBox="0 0 24 24"
                                fill="currentColor">
                                <path d="M8 5.14v13.72l11-6.86L8 5.14z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="space-y-5">
                <div class="flex justify-between items-center px-1">
                    <div class="text-[11px] font-black uppercase opacity-50">循环区间</div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="loop-start-num"
                            class="text-[12px] font-mono font-black text-blue-500 bg-transparent border-none outline-none w-10 text-right"
                            value="0.0%" onfocus="this.select()">
                        <span class="opacity-30 text-[11px]">-</span>
                        <input type="text" id="loop-end-num"
                            class="text-[12px] font-mono font-black text-blue-500 bg-transparent border-none outline-none w-10 text-left"
                            value="100.0%" onfocus="this.select()">
                    </div>
                </div>
                <div class="flex items-center gap-[10px]">
                    <div id="ab-track-el" class="ab-track flex-grow" style="margin-left: 7px;">
                        <div id="ab-selection" class="ab-selection"></div>
                        <div id="ab-handle-start" class="ab-handle"></div>
                        <div id="ab-handle-end" class="ab-handle"></div>
                    </div>
                    <div class="w-10 flex justify-end">
                        <button id="reset-loop-btn" class="btn-control-circle active-bounce-circle">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="3.5">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                <path d="M3 3v5h5" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-grow relative overflow-hidden h-screen bg-transparent flex flex-col">
        <div class="absolute top-8 right-8 z-20 flex gap-3 items-center">
            <button id="blend-toggle" class="glass-panel active-bounce-rect hover:bg-white/10" title="叠加模式 (隐藏底图)">
                <svg class="blend-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <circle cx="8.5" cy="12" r="10" />
                    <circle cx="15.5" cy="12" r="10" />
                    <path d="M 12 2.63 A 10 10 0 0 1 12 21.37 A 10 10 0 0 1 12 2.63 Z" fill="currentColor"
                        fill-opacity="0.5" />
                </svg>
            </button>
            <button id="invert-toggle" class="glass-panel active-bounce-rect hover:bg-white/10" title="反向颜色">
                <svg class="invert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor" />
                </svg>
            </button>
            <button id="reset-view" class="glass-panel active-bounce-rect hover:bg-white/10">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>复位视图</button>
            <button id="theme-toggle" class="glass-panel active-bounce-rect hover:bg-white/10">
                <svg class="sun-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />

                const VS_SOURCE = `attribute vec2 a_position; attribute vec2 a_uv; varying vec2 v_uv; void main() { gl_Position = vec4(a_position, 0, 1); v_uv = a_uv; }`;

                manualPhase = Math.max(loopStart, manualPhase - step);
                accumTime = manualPhase / rate; // 同步内部累积时间防止跳变
                timelineSlider.value = manualPhase;
                timelineNum.value = (manualPhase * 100).toFixed(1) + '%';
                renderCanvas();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                if (isPlaying) { isPlaying = false; updatePlayBtn(); }
                // 单帧前进：支持 Ctrl 加速 10 倍
                const step = e.ctrlKey ? 0.02 : 0.002;
                manualPhase = Math.min(loopEnd, manualPhase + step);
                accumTime = manualPhase / rate; // 同步内部累积时间防止跳变
                timelineSlider.value = manualPhase;
                timelineNum.value = (manualPhase * 100).toFixed(1) + '%';
                renderCanvas();
            }
        });

        // --- 手机端双击视口播放/暂停手势 ---
        let lastTapTime = 0;
        viewport.addEventListener('touchend', (e) => {
            const currentTime = Date.now();
            const tapInterval = currentTime - lastTapTime;
            if (tapInterval < 300 && tapInterval > 0) {
                e.preventDefault();
                isPlaying = !isPlaying;
                updatePlayBtn();
            }
            lastTapTime = currentTime;
        });

        setTimeout(updateABUI, 100);

        // 页面初始化时默认加载 default.png
        const defaultImg = new Image();
        defaultImg.onload = () => {
            processSource(defaultImg, 'default.png');
        };
        defaultImg.src = 'default.png';
    </script>
</body>

</html>
