<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAYLIGHT Studio Standalone V3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --easing: cubic-bezier(0.4, 0, 0.2, 1); --sidebar-w: 380px; --spring: cubic-bezier(0.68, -0.6, 0.32, 1.6); }
        .theme-dark { --surface: #0a0a0a; --on-surface: #fff; --glass-bg: rgba(255,255,255,0.03); --glass-border: rgba(255,255,255,0.08); }
        .theme-light { --surface: #f8fafc; --on-surface: #0f172a; --glass-bg: rgba(255,255,255,0.7); --glass-border: rgba(0,0,0,0.05); }

        body { background-color: var(--surface); color: var(--on-surface); font-family: 'Outfit', sans-serif; overflow: hidden; height: 100vh; }
        
        .aurora-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.5; background: radial-gradient(circle at 10% 10%, rgba(59,130,246,0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(59,130,246,0.06) 0%, transparent 40%); filter: blur(80px); }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(40px); border: 1px solid var(--glass-border); border-radius: 28px; }
        .bento-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; transition: all 0.4s var(--easing); }
        .bento-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .layer-item:active { transform: scale(0.97); }
        /* 深度屏蔽：当内部任何交互元素处于 active 时，父容器强制不发生缩放 */
        .layer-item:has(button:active, input:active, .key-toggle:active, a:active):active { transform: translateY(-2px) !important; }
        
        .mode-btn:active, .base-toggle-btn:active, .del-btn:active, .prev-reset-btn:active { transform: scale(0.95) !important; }
        #dropzone.drag-active { border-color: var(--accent); background: rgba(59,130,246,0.05); transform: scale(1.02); }

        .keying-panel { max-height: 0; overflow: hidden; transition: all 0.5s var(--spring); transform: scaleY(0.95); transform-origin: top; opacity: 0; }
        .layer-item.keying-open .keying-panel { max-height: 400px; margin-top: 12px; transform: scaleY(1); opacity: 1; }
        
        .bg-checkerboard { background-image: conic-gradient(#1a1a1a 90deg, #222 90deg 180deg, #1a1a1a 180deg 270deg, #222 270deg); background-size: 10px 10px; }
        
        /* Magnifier */
        .magnifier {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            pointer-events: none;
            overflow: hidden;
            display: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.3);
            background: #000;
            z-index: 100;
        }
        .magnifier canvas { image-rendering: pixelated; }
        .magnifier::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 12px 12px;
            background-position: center center;
            pointer-events: none;
        }
        .magnifier-center {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            transform: translate(-50%, -50%);
            border: 1px solid white;
            box-shadow: 0 0 0 500px rgba(0,0,0,0.1);
        }
        
        .prev-reset-btn {
            position: absolute;
            top: 8px; right: 8px;
            width: 24px; height: 24px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border-radius: 6px;
            display: flex;
            items-center: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            opacity: 0;
            transition: all 0.3s;
            cursor: pointer;
            z-index: 10;
        }
        .layer-preview-container:hover .prev-reset-btn { opacity: 1; }
        .prev-reset-btn:hover { background: var(--accent); color: white; border-color: transparent; }

        * { -webkit-user-drag: none; user-select: none; }
        img, canvas { user-select: none; -webkit-user-drag: none; }
        input, select, textarea { user-select: text; }
        
        #reset-view { position: fixed; bottom: 32px; right: 32px; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.4s var(--easing); }
        #reset-view.visible { opacity: 1; pointer-events: auto; }
        #reset-view:hover { transform: translateY(-2px); border-color: var(--accent); }


        #main-sidebar { width: var(--sidebar-w); transition: transform 0.5s var(--easing), width 0.5s var(--easing); flex-shrink: 0; position: relative; height: 100vh; z-index: 50; }
        #main-sidebar.collapsed { width: 0; padding: 0; transform: translateX(-100%); }

        canvas { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 24px; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5); cursor: move; }
        .layer-preview-container canvas { cursor: crosshair !important; border-radius: 12px; box-shadow: none; user-select: none; -webkit-user-drag: none; }
        .layer-item.dragging { opacity: 0.5; border: 2px dashed var(--accent); }
        .layer-expanded { max-height: 0; overflow: hidden; transition: max-height 0.4s var(--easing); }
        .layer-item.open .layer-expanded { max-height: 500px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 12px; }

        input[type="range"] { appearance: none; width: 100%; height: 4px; background: rgba(59,130,246,0.1); border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; }

        #sidebar-toggle { position: absolute; top: 24px; right: -24px; z-index: 100; width: 48px; height: 48px; border-radius: 0 14px 14px 0; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; box-shadow: 10px 0 20px rgba(59,130,246,0.2); transition: all 0.3s var(--easing); }
        #sidebar-toggle:hover { width: 56px; padding-left: 8px; }
        #main-sidebar.collapsed #sidebar-toggle { right: -48px; border-radius: 0 14px 14px 0; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.2); border-radius: 10px; }

        .shimmer-text { background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.1) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: scan 3s linear infinite; }
        @keyframes scan { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    </style>
</head>
<body class="flex theme-dark">
    <div class="aurora-bg"></div>
    <aside id="main-sidebar" class="p-6 flex flex-col gap-6">
        <div id="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></div>
        <header class="px-2 flex-shrink-0">
            <h1 class="text-2xl font-black tracking-tighter flex items-center gap-3">
                <span class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-sm text-white">G</span>
                <span>GRAYLIGHT <span class="text-blue-500 italic">Studio</span></span>
            </h1>
        </header>

        <div id="dropzone" class="bento-card p-8 flex flex-col items-center justify-center gap-4 cursor-pointer border-dashed border-2 grow-0 group h-[180px] flex-shrink-0">
            <div class="w-14 h-14 rounded-full bg-blue-500/10 flex items-center justify-center border border-blue-500/20 group-hover:scale-110 transition-transform">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="text-center">
                <p class="text-sm font-black tracking-widest uppercase">点击或拖拽添加素材</p>
                <p class="text-[10px] opacity-30 mt-1">SUPPORT IMG / IES / LUT</p>
            </div>
        </div>

        <div class="glass-panel flex-grow flex flex-col overflow-hidden min-h-0">
            <div class="p-5 border-b border-white/5 flex items-center justify-between flex-shrink-0">
                <span class="text-xs font-black tracking-[0.3em] uppercase opacity-40">图层管理</span>
            </div>
            <div id="layer-list" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <div class="text-center py-20 opacity-20 italic text-xs">等待素材导入...</div>
            </div>
        </div>

        <div class="glass-panel p-6 space-y-6 flex-shrink-0">
            <div class="space-y-4">
                <div class="flex justify-between text-[10px] font-black uppercase tracking-widest opacity-40 px-1">
                    <span>动画速率</span><span id="rate-num" class="text-blue-500">1.0x</span>
                </div>
                <input type="range" id="rate-slider" min="0" max="2" step="0.1" value="1.0">
            </div>
            <div class="space-y-4">
                <div class="flex justify-between text-[10px] font-black uppercase tracking-widest opacity-40 px-1">
                    <span>底图亮度</span><span id="bright-num" class="text-blue-100">1.0x</span>
                </div>
                <input type="range" id="bright-slider" min="0" max="2" step="0.1" value="1.0">
            </div>
        </div>
    </aside>

    <main class="flex-grow relative flex items-center justify-center p-12 overflow-hidden h-screen">
        <div class="absolute top-8 right-8 z-20 flex gap-3">
            <button id="theme-toggle" class="glass-panel w-10 h-10 flex items-center justify-center hover:bg-white/5 transition-colors">
                <!-- Sun Icon -->
                <svg class="sun-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <!-- Moon Icon -->
                <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
        <button id="reset-view" class="glass-panel px-6 py-3 text-[10px] font-black tracking-[0.2em] uppercase">视图复原</button>
        <div id="viewport" class="w-full h-full flex items-center justify-center relative">
            <canvas id="main-canvas"></canvas>
            <div id="placeholder" class="text-center">
                <div class="text-7xl font-black tracking-tighter shimmer-text mb-4">TECHSUN</div>
                <div class="text-[10px] tracking-[1.50em] opacity-20 uppercase">Ready For Creation</div>
            </div>
        </div>
    </main>

    <input type="file" id="file-input" hidden multiple accept="image/*">

    <script>
        const layers = [];
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');
        const layerList = document.getElementById('layer-list');
        const fileInput = document.getElementById('file-input');
        const dropzone = document.getElementById('dropzone');
        
        let viewScale = 1;
        let viewPos = { x: 0, y: 0 };
        let isDraggingView = false;
        let lastMouse = { x: 0, y: 0 };

        function updateUI() {
            if (layers.length === 0) {
                layerList.innerHTML = '<div class="text-center py-20 opacity-20 italic text-xs">等待素材导入...</div>';
                document.getElementById('placeholder').style.display = 'block';
                canvas.style.display = 'none';
                document.getElementById('reset-view').classList.remove('visible');
                return;
            }
            document.getElementById('placeholder').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('reset-view').classList.add('visible');

            layerList.innerHTML = '';
            [...layers].reverse().forEach((layer, index) => {
                const i = layers.length - 1 - index;
                const div = document.createElement('div');
                div.className = `layer-item bento-card p-4 cursor-pointer group ${layer.open ? 'open' : ''} ${layer.keyingOpen ? 'keying-open' : ''}`;
                div.draggable = true;
                div.innerHTML = `
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <div class="opacity-20 hover:opacity-100 cursor-grab flex-shrink-0">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/></svg>
                            </div>
                            <span class="text-[11px] font-black uppercase tracking-widest opacity-80 truncate">${layer.name}</span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <div class="p-1.5 hover:bg-white/10 rounded-md eye-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="${layer.visible ? 'text-blue-500' : 'opacity-20'}"><path d="M20 12s-3 7-10 7-10-7-10-7 3-7 10-7 10 7 10 7Z"/><circle cx="12" cy="12" r="3"/></svg></div>
                            <div class="p-1.5 hover:bg-white/10 rounded-md fold-btn transition-transform ${layer.open ? 'rotate-180' : ''}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></div>
                        </div>
                    </div>
                    <div class="layer-expanded">
                        <!-- New Keying Section (Level 1) -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-between p-3.5 bg-white/5 rounded-2xl hover:bg-white/[0.08] transition-colors key-toggle cursor-pointer border border-white/5">
                                <div class="flex items-center gap-3">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500">
                                        <path d="m2 22 1-1h3l9-9"/><path d="M12.1 7c0-1.5 1.5-3 3-3s3 1.5 3 3"/><path d="m19 11-4-4"/><path d="m22 2-3 3"/><path d="m5 11 4-4"/>
                                    </svg>
                                    <span class="text-[11px] font-black uppercase tracking-widest opacity-80">吸色抠图</span>
                                </div>
                                <div class="w-7 h-7 rounded-full bg-white/5 flex items-center justify-center transition-all duration-500 ${layer.keyingOpen ? 'rotate-180 scale-110 !bg-blue-500/20' : ''}" style="transition-timing-function: var(--spring)">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="${layer.keyingOpen ? 'text-blue-400' : 'opacity-40'}"><path d="m18 15-6-6-6 6"/></svg>
                                </div>
                            </div>

                            <div class="keying-panel">
                                <div class="bg-black/30 rounded-2xl p-4 gap-4 flex flex-col border border-white/5">
                                    <div class="relative w-full aspect-video bg-checkerboard rounded-xl overflow-hidden cursor-crosshair layer-preview-container group/preview">
                                        <canvas id="prev-${i}" class="layer-preview w-full h-full object-contain"></canvas>
                                        <div id="mag-${i}" class="magnifier">
                                            <canvas width="120" height="120"></canvas>
                                            <div class="magnifier-center"></div>
                                        </div>
                                        <div class="prev-reset-btn" title="复位视口">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                                        </div>
                                    </div>
                                    <div class="flex items-center justify-between gap-4">
                                        <div class="flex items-center gap-2 px-3 py-2 bg-white/5 rounded-xl border border-white/10 group-focus-within:border-blue-500/50 transition-colors">
                                            <div class="w-4 h-4 rounded-sm border border-white/10 flex-shrink-0" style="background: ${layer.maskColor || 'transparent'}"></div>
                                            <input type="text" class="hex-input bg-transparent border-none outline-none text-[11px] font-mono tracking-tighter w-16 text-white/50 focus:text-white transition-colors" value="${layer.maskColor || '#000000'}" spellcheck="false" onclick="event.stopPropagation()">
                                        </div>
                                        <div class="flex-grow flex items-center gap-3">
                                            <span class="text-[10px] font-black opacity-20 uppercase tracking-tighter flex-shrink-0">容差</span>
                                            <input type="range" class="tolerance-slider grow" min="0" max="100" value="${layer.tolerance || 30}">
                                            <span class="text-[11px] font-mono text-blue-400 w-5 text-right font-black">${layer.tolerance || 30}</span>
                                        </div>
                                    </div>
                                    <div class="flex justify-center">
                                        <span class="text-[9px] opacity-10 font-black uppercase tracking-[0.2em]">滚轮以鼠标为中心放缩</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Function Buttons Row (Level 2) -->
                            <div class="flex gap-2">
                                <button class="mode-btn flex-1 py-2.5 bg-white/5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-colors border border-white/5 ${layer.mode === 'white' ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' : 'opacity-40'}" data-mode="white">白光模式</button>
                                <button class="mode-btn flex-1 py-2.5 bg-white/5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-colors border border-white/5 ${layer.mode === 'rainbow' ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' : 'opacity-40'}" data-mode="rainbow">全息模式</button>
                                <button class="base-toggle-btn flex-1 py-2.5 bg-white/5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-colors border border-white/5 ${layer.isBase ? 'bg-blue-500 text-white border-blue-500 shadow-lg shadow-blue-500/20' : 'opacity-40'}">作为底图</button>
                                <button class="del-btn w-12 flex items-center justify-center bg-white/5 rounded-xl hover:bg-red-500/10 text-white/20 hover:text-red-500 transition-colors border border-white/5">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                div.onclick = (e) => {
                    layer.open = !layer.open;
                    updateUI();
                };

                div.querySelector('.eye-btn').onclick = (e) => { e.stopPropagation(); layer.visible = !layer.visible; updateUI(); };
                div.querySelector('.del-btn').onclick = (e) => { e.stopPropagation(); layers.splice(i, 1); updateUI(); };
                
                div.querySelector('.key-toggle').onclick = (e) => {
                    e.stopPropagation();
                    layer.keyingOpen = !layer.keyingOpen;
                    updateUI();
                };

                div.querySelectorAll('.mode-btn, .base-toggle-btn, .del-btn, .keying-panel').forEach(el => {
                    el.onclick = (e) => e.stopPropagation();
                });

                div.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        layer.mode = btn.dataset.mode;
                        updateUI();
                    });
                });

                div.querySelector('.base-toggle-btn').onclick = (e) => {
                    e.stopPropagation();
                    const wasBase = layer.isBase;
                    layers.forEach(l => l.isBase = false);
                    layer.isBase = !wasBase;
                    if (layer.isBase) {
                        const l = layers.splice(i, 1)[0];
                        layers.unshift(l);
                    }
                    updateUI();
                };

                const hexInput = div.querySelector('.hex-input');
                const colorDisp = div.querySelector('.keying-panel .rounded-sm');

                hexInput.oninput = (e) => {
                    e.stopPropagation();
                    let val = e.target.value;
                    if (!val.startsWith('#')) val = '#' + val;
                    if (/^#[0-9A-F]{6}$/i.test(val)) {
                        layer.maskColor = val.toUpperCase();
                        layer.maskRGB = [
                            parseInt(val.slice(1,3), 16),
                            parseInt(val.slice(3,5), 16),
                            parseInt(val.slice(5,7), 16)
                        ];
                        colorDisp.style.background = layer.maskColor;
                    }
                };

                const tolSlider = div.querySelector('.tolerance-slider');
                const tolVal = div.querySelector('.tolerance-slider + span');
                tolSlider.oninput = (e) => {
                    e.stopPropagation();
                    layer.tolerance = parseInt(e.target.value);
                    tolVal.textContent = layer.tolerance;
                };
                tolSlider.onclick = (e) => e.stopPropagation();

                layerList.appendChild(div);
                
                // --- Magnifier & Picker Logic & Zoom/Pan ---
                if (layer.keyingOpen) {
                    const pCanvas = document.getElementById(`prev-${i}`);
                    const mag = document.getElementById(`mag-${i}`);
                    const magCtx = mag.querySelector('canvas').getContext('2d');
                    if (pCanvas) {
                        const pCtx = pCanvas.getContext('2d');
                        pCanvas.width = 400; // Fixed width for panel
                        pCanvas.height = 225; // 16:9
                        
                        // Initialize layer preview state if not present
                        if (layer.prevScale === undefined) {
                            layer.prevScale = 1;
                            layer.prevOffset = { x: 0, y: 0 };
                        }

                        const renderPreview = () => {
                            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
                            pCtx.imageSmoothingEnabled = false;
                            
                            const canvasAspect = pCanvas.width / pCanvas.height;
                            const imgAspect = layer.img.width / layer.img.height;
                            let baseW, baseH;
                            
                            if (imgAspect > canvasAspect) {
                                baseW = pCanvas.width;
                                baseH = pCanvas.width / imgAspect;
                            } else {
                                baseH = pCanvas.height;
                                baseW = pCanvas.height * imgAspect;
                            }

                            const drawW = baseW * layer.prevScale;
                            const drawH = baseH * layer.prevScale;
                            const drawX = (pCanvas.width - drawW) / 2 + layer.prevOffset.x;
                            const drawY = (pCanvas.height - drawH) / 2 + layer.prevOffset.y;
                            
                            pCtx.drawImage(layer.img, drawX, drawY, drawW, drawH);
                        };
                        renderPreview();

                        pCanvas.onwheel = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            const rect = pCanvas.getBoundingClientRect();
                            const scaleFactor = pCanvas.width / rect.width;
                            const mx = (e.clientX - rect.left) * scaleFactor;
                            const my = (e.clientY - rect.top) * (pCanvas.height / rect.height);

                            const oldScale = layer.prevScale;
                            const zoom = e.deltaY > 0 ? 0.9 : 1.1;
                            const newScale = oldScale * zoom;
                            
                            const imgAspect = layer.img.width / layer.img.height;
                            const canvasAspect = pCanvas.width / pCanvas.height;
                            let baseW = (imgAspect > canvasAspect) ? pCanvas.width : (pCanvas.height * imgAspect);
                            let baseH = (imgAspect > canvasAspect) ? (pCanvas.width / imgAspect) : pCanvas.height;

                            const drawX_old = (pCanvas.width - baseW * oldScale) / 2 + layer.prevOffset.x;
                            const drawY_old = (pCanvas.height - baseH * oldScale) / 2 + layer.prevOffset.y;
                            
                            const ix_norm = (mx - drawX_old) / (baseW * oldScale);
                            const iy_norm = (my - drawY_old) / (baseH * oldScale);
                            
                            const drawX_new = mx - ix_norm * (baseW * newScale);
                            const drawY_new = my - iy_norm * (baseH * newScale);
                            
                            layer.prevScale = newScale;
                            layer.prevOffset.x = drawX_new - (pCanvas.width - baseW * newScale) / 2;
                            layer.prevOffset.y = drawY_new - (pCanvas.height - baseH * newScale) / 2;
                            
                            renderPreview();
                        };

                        const resetBtn = div.querySelector('.prev-reset-btn');
                        resetBtn.onclick = (e) => {
                            e.stopPropagation();
                            layer.prevScale = 1;
                            layer.prevOffset = { x: 0, y: 0 };
                            renderPreview();
                        };

                        let isPanning = false;
                        let lastPan = { x: 0, y: 0 };

                        pCanvas.onmousedown = (e) => {
                            // Removing pan functionality per user request
                        };
                        pCanvas.oncontextmenu = (e) => e.preventDefault();

                        pCanvas.onmousemove = (e) => {
                            const rect = pCanvas.getBoundingClientRect();
                            const scaleFactor = pCanvas.width / rect.width;
                            const mx = (e.clientX - rect.left) * scaleFactor;
                            const my = (e.clientY - rect.top) * (pCanvas.height / rect.height);
                            
                            if (isPanning) {
                                layer.prevOffset.x += (e.clientX - lastPan.x) * scaleFactor;
                                layer.prevOffset.y += (e.clientY - lastPan.y) * (pCanvas.height / rect.height);
                                lastPan = { x: e.clientX, y: e.clientY };
                                renderPreview();
                                return;
                            }

                            mag.style.display = 'block';
                            // Magnifier element position should be on screen space (unscaled)
                            mag.style.left = `${(e.clientX - rect.left) - 60}px`;
                            mag.style.top = `${(e.clientY - rect.top) - 60}px`;

                            const imgAspect = layer.img.width / layer.img.height;
                            const canvasAspect = pCanvas.width / pCanvas.height;
                            let baseW = (imgAspect > canvasAspect) ? pCanvas.width : (pCanvas.height * imgAspect);
                            let baseH = (imgAspect > canvasAspect) ? (pCanvas.width / imgAspect) : pCanvas.height;

                            const drawW = baseW * layer.prevScale;
                            const drawH = baseH * layer.prevScale;
                            const drawX = (pCanvas.width - drawW) / 2 + layer.prevOffset.x;
                            const drawY = (pCanvas.height - drawH) / 2 + layer.prevOffset.y;

                            const imgX = Math.floor(((mx - drawX) / drawW) * layer.img.width);
                            const imgY = Math.floor(((my - drawY) / drawH) * layer.img.height);

                            // Zoom logic for magnifier (Sample 11x11 from ORIGINAL image)
                            magCtx.imageSmoothingEnabled = false;
                            magCtx.clearRect(0, 0, 120, 120);
                            
                            // Sample from layer.img directly
                            const sSize = 11;
                            const sHalf = 5; // Fixed center alignment
                            magCtx.drawImage(
                                layer.img, 
                                imgX - sHalf, imgY - sHalf, sSize, sSize, 
                                0, 0, 120, 120
                            );

                            // Guide crosshair for pixel identification
                            magCtx.strokeStyle = 'rgba(255,255,255,0.5)';
                            magCtx.strokeRect(54, 54, 12, 12);

                            // Sync color box using ORIGINAL source data (Real-time preview only)
                            if (imgX >= 0 && imgX < layer.img.width && imgY >= 0 && imgY < layer.img.height) {
                                const tmpCanvas = document.createElement('canvas');
                                tmpCanvas.width = 1; tmpCanvas.height = 1;
                                const tCtx = tmpCanvas.getContext('2d');
                                tCtx.drawImage(layer.img, imgX, imgY, 1, 1, 0, 0, 1, 1);
                                const pixel = tCtx.getImageData(0, 0, 1, 1).data;
                                const hex = `#${pixel[0].toString(16).padStart(2, '0')}${pixel[1].toString(16).padStart(2, '0')}${pixel[2].toString(16).padStart(2, '0')}`.toUpperCase();
                                colorDisp.style.background = hex;
                                hexInput.value = hex;
                            } else {
                                // Clear visual feedback if outside image bounds but inside checkerboard
                                colorDisp.style.background = 'transparent';
                                hexInput.value = '#000000';
                            }
                        };

                        pCanvas.onmouseleave = () => {
                            mag.style.display = 'none';
                            // Restore UI to the actual mask color
                            colorDisp.style.background = layer.maskColor || 'transparent';
                            hexInput.value = layer.maskColor || '#000000';
                        };
                        window.onmouseup = () => isPanning = false;
                        
                        pCanvas.onclick = (e) => {
                            if (isPanning) return;
                            e.stopPropagation();
                            const rect = pCanvas.getBoundingClientRect();
                            const scaleFactor = pCanvas.width / rect.width;
                            const mx = (e.clientX - rect.left) * scaleFactor;
                            const my = (e.clientY - rect.top) * (pCanvas.height / rect.height);

                            const imgAspect = layer.img.width / layer.img.height;
                            const canvasAspect = pCanvas.width / pCanvas.height;
                            let baseW = (imgAspect > canvasAspect) ? pCanvas.width : (pCanvas.height * imgAspect);
                            let baseH = (imgAspect > canvasAspect) ? (pCanvas.width / imgAspect) : pCanvas.height;

                            const drawW = baseW * layer.prevScale;
                            const drawH = baseH * layer.prevScale;
                            const drawX = (pCanvas.width - drawW) / 2 + layer.prevOffset.x;
                            const drawY = (pCanvas.height - drawH) / 2 + layer.prevOffset.y;

                            const imgX = Math.floor(((mx - drawX) / drawW) * layer.img.width);
                            const imgY = Math.floor(((my - drawY) / drawH) * layer.img.height);

                            if (imgX >= 0 && imgX < layer.img.width && imgY >= 0 && imgY < layer.img.height) {
                                const tmpCanvas = document.createElement('canvas');
                                tmpCanvas.width = 1; tmpCanvas.height = 1;
                                const tCtx = tmpCanvas.getContext('2d');
                                tCtx.drawImage(layer.img, imgX, imgY, 1, 1, 0, 0, 1, 1);
                                const pixel = tCtx.getImageData(0, 0, 1, 1).data;
                                layer.maskColor = `#${pixel[0].toString(16).padStart(2, '0')}${pixel[1].toString(16).padStart(2, '0')}${pixel[2].toString(16).padStart(2, '0')}`.toUpperCase();
                                layer.maskRGB = [pixel[0], pixel[1], pixel[2]];
                                updateUI();
                            }
                        };
                    }
                }
            });
        }


        let animTime = 0;
        function renderCanvas() {
            if (layers.length === 0) return;
            
            const baseLayer = layers.find(l => l.isBase) || layers[0];
            if (canvas.width !== baseLayer.img.width || canvas.height !== baseLayer.img.height) {
                canvas.width = baseLayer.img.width;
                canvas.height = baseLayer.img.height;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            layers.forEach(layer => {
                if (!layer.visible) return;
                
                // Handle masking via offscreen canvas
                let drawImg = layer.img;
                if (layer.maskRGB) {
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = layer.img.width;
                    offCanvas.height = layer.img.height;
                    const oCtx = offCanvas.getContext('2d');
                    oCtx.drawImage(layer.img, 0, 0);
                    const imageData = oCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
                    const data = imageData.data;
                    const [mr, mg, mb] = layer.maskRGB;
                    const tol = (layer.tolerance || 30) * 2.55;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i+1], b = data[i+2];
                        const diff = Math.sqrt((r-mr)**2 + (g-mg)**2 + (b-mb)**2);
                        if (diff < tol) data[i+3] = 0;
                    }
                    oCtx.putImageData(imageData, 0, 0);
                    drawImg = offCanvas;
                }

                if (layer.isBase) {
                    const bright = parseFloat(document.getElementById('bright-slider').value);
                    ctx.filter = `brightness(${bright})`;
                    ctx.drawImage(drawImg, 0, 0, canvas.width, canvas.height);
                    ctx.filter = 'none';
                } else {
                    const rate = parseFloat(document.getElementById('rate-slider').value);
                    if (layer.mode === 'rainbow') {
                        // Holographic animation effect
                        animTime += 0.01 * rate;
                        ctx.globalCompositeOperation = 'screen';
                        ctx.drawImage(drawImg, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.globalCompositeOperation = 'screen';
                        ctx.drawImage(drawImg, 0, 0, canvas.width, canvas.height);
                    }
                    ctx.globalCompositeOperation = 'source-over';
                }
            });
            
            canvas.style.transform = `translate(${viewPos.x}px, ${viewPos.y}px) scale(${viewScale})`;
        }

        function animate() {
            renderCanvas();
            requestAnimationFrame(animate);
        }
        animate();

        // --- Event Listeners ---
        dropzone.onclick = () => fileInput.click();
        
        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const img = new Image();
                img.onload = () => {
                    layers.push({
                        img, name: file.name, visible: true, open: false,
                        isBase: layers.length === 0, mode: 'white'
                    });
                    updateUI();
                    renderCanvas();
                };
                img.src = URL.createObjectURL(file);
            });
        }

        fileInput.onchange = (e) => handleFiles(e.target.files);

        // Drag & Drop
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('drag-active');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('drag-active');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-active');
            handleFiles(e.dataTransfer.files);
        });

        // --- View Controls ---
        viewport.onmousedown = (e) => {
            if (e.target.id === 'viewport' || e.target.id === 'main-canvas') {
                isDraggingView = true;
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        };
        window.onmousemove = (e) => {
            if (!isDraggingView) return;
            viewPos.x += e.clientX - lastMouse.x;
            viewPos.y += e.clientY - lastMouse.y;
            lastMouse = { x: e.clientX, y: e.clientY };
            renderCanvas();
        };
        window.onmouseup = () => isDraggingView = false;
        viewport.onwheel = (e) => {
            e.preventDefault();
            viewScale *= e.deltaY > 0 ? 0.9 : 1.1;
            renderCanvas();
        };

        document.getElementById('reset-view').onclick = () => {
            viewScale = 1; viewPos = { x: 0, y: 0 }; renderCanvas();
        };

        document.getElementById('sidebar-toggle').onclick = () => {
            document.getElementById('main-sidebar').classList.toggle('collapsed');
        };

        document.getElementById('rate-slider').oninput = (e) => {
            document.getElementById('rate-num').textContent = e.target.value + 'x';
        };
        document.getElementById('bright-slider').oninput = (e) => {
            document.getElementById('bright-num').textContent = e.target.value + 'x';
        };

        // Theme logic
        const themeToggle = document.getElementById('theme-toggle');
        const sun = themeToggle.querySelector('.sun-icon');
        const moon = themeToggle.querySelector('.moon-icon');
        
        themeToggle.onclick = () => {
            const isDark = document.body.classList.contains('theme-dark');
            if (isDark) {
                document.body.classList.replace('theme-dark', 'theme-light');
                document.documentElement.classList.remove('dark');
                sun.classList.remove('hidden');
                moon.classList.add('hidden');
            } else {
                document.body.classList.replace('theme-light', 'theme-dark');
                document.documentElement.classList.add('dark');
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
            }
        };

        // Init
        updateUI();
    </script>
</body>
</html>
